spring.application.name=DokSus Server

# Server Configuration
server.port=8080

# MongoDB Connection
spring.mongodb.uri=mongodb://localhost:27017/doksus

# Set to DEBUG locally when database queries should be printed
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO

# Browser addresses allowed to call this API. Comma-separated.
# In production add the public site, e.g. http://localhost:5173,https://doksus.example.hr
# Override without editing this file: APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=http://localhost:5173

# Maximum size for a single file
spring.servlet.multipart.max-file-size=30MB

# Maximum size for the entire request (files + JSON data)
spring.servlet.multipart.max-request-size=35MB

# Secret for jwt. In production override with the JWT_SECRET environment variable.
# Also override the database address with SPRING_MONGODB_URI.
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970