spring.application.name=DokSus Server

# Server Configuration
server.port=8080

# MongoDB Connection
spring.mongodb.uri=mongodb://localhost:27017/doksus

# Optional: Show MongoDB queries in the console for debugging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Maximum size for a single file
spring.servlet.multipart.max-file-size=30MB

# Maximum size for the entire request (files + JSON data)
spring.servlet.multipart.max-request-size=35MB

